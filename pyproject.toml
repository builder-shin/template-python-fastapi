[project]
name = "template-python-fastapi"
version = "0.1.0"
description = "Production-ready FastAPI JSON:API template"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.12,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = [".venv/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short --cov=app --cov=config --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app", "config"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
