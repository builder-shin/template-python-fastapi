repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # The project virtualenv owns the SQLAlchemy and Pydantic plugins and stubs,
        # so mirrors-mypy's isolated environment would report a different error set
        # than scripts/check.sh.
        entry: uv run mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
